networks:
  sigue-adelante-radio:
    external: true

services:
  stream-backend:
    container_name: sar-stream-backend
    image: sar-stream-backend:1.0.0
    build: .
    ports:
      - "6000:80/tcp"
    restart: always
    networks:
      - sigue-adelante-radio
    environment:
      PORT: 80
      DATABASE_URL: $DATABASE_URL
      AZURA_API_KEY: $AZURA_API_KEY
      AZURA_API_URL: $AZURA_API_URL
      AZURA_STATION_ID: $AZURA_STATION_ID
      WEBHOOK_USER: $WEBHOOK_USER
      WEBHOOK_PASSWORD: $WEBHOOK_PASSWORD

